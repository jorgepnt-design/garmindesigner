name: Zifferblatt bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEVICE: venux1
      PROJECT: ElegantFace
    steps:
      - uses: actions/checkout@v4

      - name: Garmin-Zugang pruefen
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          if [ -z "$GARMIN_USERNAME" ] || [ -z "$GARMIN_PASSWORD" ]; then
            echo "::error::Bitte unter Settings > Secrets and variables > Actions die Secrets GARMIN_USERNAME und GARMIN_PASSWORD anlegen."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Connect IQ SDK Manager installieren
        run: go install github.com/lindell/connect-iq-sdk-manager-cli@v0.8.4

      - name: SDK und Geraetedaten laden
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          M="$(go env GOPATH)/bin/connect-iq-sdk-manager-cli"
          "$M" agreement accept
          "$M" login
          "$M" sdk set ">=8.0.0"
          "$M" device download --manifest "$PROJECT/manifest.xml"
          echo "$("$M" sdk current-path --bin)" >> "$GITHUB_PATH"

      - name: Entwickler-Schluessel bereitstellen
        env:
          DEVELOPER_KEY_B64: ${{ secrets.DEVELOPER_KEY_B64 }}
        run: |
          if [ -n "$DEVELOPER_KEY_B64" ]; then
            echo "$DEVELOPER_KEY_B64" | base64 -d > developer_key.der
          else
            # Fuers Aufspielen per USB reicht ein frisch erzeugter Schluessel
            openssl genrsa -out key.pem 4096
            openssl pkcs8 -topk8 -inform PEM -outform DER -in key.pem -out developer_key.der -nocrypt
            rm key.pem
          fi

      - name: .prg bauen
        run: monkeyc -d "$DEVICE" -f "$PROJECT/monkey.jungle" -o "$PROJECT.prg" -y developer_key.der -w

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT }}-${{ env.DEVICE }}
          path: ${{ env.PROJECT }}.prg

      - name: Als Release "neueste" veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete neueste --yes --cleanup-tag || true
          gh release create neueste "$PROJECT.prg" "$PROJECT/vorschau.png" \
            --title "Zifferblatt Elegant – Venu X1" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. ElegantFace.prg herunterladen und per USB in GARMIN/APPS auf die Uhr kopieren."
