name: Zifferblatt bauen

on:
  push:
    branches: [main]
    paths:
      - 'designs/**'
      - 'tools/**'
      - 'ElegantFace/**'
      - 'web/support.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

# Nacheinander bauen, damit sich zwei Uploads nicht das Release ueberschreiben
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Garmin-Zugang pruefen
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          if [ -z "$GARMIN_USERNAME" ] || [ -z "$GARMIN_PASSWORD" ]; then
            echo "::error::Bitte unter Settings > Secrets and variables > Actions die Secrets GARMIN_USERNAME und GARMIN_PASSWORD anlegen."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Werkzeuge installieren
        run: |
          go install github.com/lindell/connect-iq-sdk-manager-cli@v0.8.4
          pip install pillow==12.3.0

      - name: Designs in Connect-IQ-Projekte umwandeln
        run: |
          mkdir -p build
          shopt -s nullglob
          for f in designs/*.json; do
            python3 tools/build_face.py "$f" "build/$(basename "$f" .json)"
          done

      - name: SDK und Geraetedaten laden
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          M="$(go env GOPATH)/bin/connect-iq-sdk-manager-cli"
          "$M" agreement accept
          "$M" login
          "$M" sdk set ">=8.0.0"
          shopt -s nullglob
          for m in ElegantFace/manifest.xml build/*/manifest.xml; do
            "$M" device download --manifest "$m"
          done
          echo "$("$M" sdk current-path --bin)" >> "$GITHUB_PATH"

      - name: Entwickler-Schluessel bereitstellen
        env:
          DEVELOPER_KEY_B64: ${{ secrets.DEVELOPER_KEY_B64 }}
        run: |
          if [ -n "$DEVELOPER_KEY_B64" ]; then
            echo "$DEVELOPER_KEY_B64" | base64 -d > developer_key.der
          else
            # Fuers Aufspielen per USB reicht ein frisch erzeugter Schluessel
            openssl genrsa -out key.pem 4096
            openssl pkcs8 -topk8 -inform PEM -outform DER -in key.pem -out developer_key.der -nocrypt
            rm key.pem
          fi

      - name: .prg-Dateien bauen
        run: |
          mkdir -p dist
          monkeyc -d venux1 -f ElegantFace/monkey.jungle -o dist/ElegantFace.prg -y developer_key.der -w
          cp ElegantFace/vorschau.png dist/ElegantFace.png
          failed=0
          shopt -s nullglob
          for dir in build/*/; do
            slug=$(basename "$dir")
            cp "$dir/vorschau.png" "dist/$slug.png"
            for dev in $(python3 -c "import json,sys;print(' '.join(json.load(open(sys.argv[1]))['devices']))" "$dir/build.json"); do
              if ! monkeyc -d "$dev" -f "$dir/monkey.jungle" -o "dist/$slug-$dev.prg" -y developer_key.der -w; then
                echo "::error::$slug fuer $dev konnte nicht gebaut werden."
                failed=1
              fi
            done
          done
          ls -la dist
          exit $failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zifferblaetter
          path: dist/

      - name: Als Release "neueste" veroeffentlichen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls dist/*.prg >/dev/null 2>&1 || exit 0
          gh release delete neueste --yes --cleanup-tag || true
          gh release create neueste dist/* \
            --title "Zifferblaetter – neueste Version" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Die passende .prg herunterladen und per USB in GARMIN/APPS auf die Uhr kopieren."
