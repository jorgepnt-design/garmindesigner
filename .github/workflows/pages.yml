name: Webseite veroeffentlichen

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/fonts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/fonts
          cp web/* _site/
          cp tools/fonts/*.ttf tools/fonts/*.otf _site/fonts/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
